<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5efe4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="生活台">
  <meta name="description" content="装进口袋的个人日常生活台">
  <meta property="og:title" content="小夏生活台">
  <meta property="og:description" content="慢慢来，也是在前进">
  <meta property="og:image" content="https://yuliyu0809.github.io/yuli-workbench/life/og.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>小夏生活台</title>
  <style>
    :root{--ink:#24342e;--muted:#7b857f;--paper:#f7f3ea;--card:#fffdf8;--sage:#668276;--clay:#d99369;--line:#e9e4d9}*{box-sizing:border-box}html,body{margin:0;background:#e9e4da;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit;color:inherit}.app{width:100%;max-width:430px;min-height:100dvh;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 20px calc(104px + env(safe-area-inset-bottom));background:var(--paper);box-shadow:0 0 60px #25322c1f}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow,.kicker{margin:0 0 5px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.13em}h1,h2,p{margin-top:0}h1,h2{font-family:Georgia,"STSong",serif;font-weight:500}h1{margin-bottom:0;font-size:28px}.avatar{width:44px;height:44px;border:1px solid #d9d3c7;border-radius:50%;background:#e4d4c0;color:#6e5849}.focus{display:flex;align-items:center;justify-content:space-between;min-height:152px;padding:25px;border-radius:26px;background:var(--sage);color:#fff;box-shadow:0 16px 35px #4461542e}.focus h2{margin-bottom:8px;font-size:23px}.focus p{margin:0;color:#ffffffb3;font-size:12px}.tag{display:inline-block;margin-bottom:15px;padding:5px 10px;border:1px solid #ffffff40;border-radius:20px;font-size:11px}.ring{display:grid;place-items:center;width:64px;height:64px;flex:none;border-radius:50%;background:conic-gradient(#f2d09c var(--p),#ffffff29 0);position:relative}.ring:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--sage)}.ring span{z-index:1;font-size:13px;font-weight:700}.section{margin-top:32px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.section-head h2,.note h2{margin-bottom:0;font-size:21px}.add-link{border:0;background:transparent;color:var(--clay);padding:8px 0;font-size:13px;font-weight:700}.list{border:1px solid var(--line);border-radius:20px;background:var(--card);overflow:hidden}.task{width:100%;display:flex;align-items:center;gap:13px;padding:15px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}.task:last-child{border-bottom:0}.check{display:grid;place-items:center;width:23px;height:23px;flex:none;border:1.5px solid #b7beb8;border-radius:50%;color:#fff;font-size:12px}.copy{display:flex;flex-direction:column;gap:4px;flex:1}.copy strong{font-size:14px}.copy small,.habit small{color:var(--muted);font-size:10px}.done .check{border-color:var(--sage);background:var(--sage)}.done strong{color:#9ba09b;text-decoration:line-through}.habits{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.habit{min-width:0;padding:13px 4px 11px;border:1px solid var(--line);border-radius:17px;background:var(--card);text-align:center;position:relative}.habit-icon{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 9px;border-radius:50%;background:#efe9dd}.habit strong{display:block;font-size:12px}.habit.on{border-color:#bdcbbf;background:#f0f4ed}.habit.on .habit-icon{background:var(--sage);color:#fff}.note{margin-top:30px;padding:20px;border:1px solid #eadcca;border-radius:22px;background:#fbf5eb}.note textarea{width:100%;min-height:82px;margin-top:16px;padding:14px;resize:none;border:0;border-radius:13px;outline:none;background:#ffffffb3;line-height:1.6}.hint{margin:8px 2px 0;color:#a49b8e;font-size:9px;text-align:right}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);height:calc(72px + env(safe-area-inset-bottom));padding:10px 22px env(safe-area-inset-bottom);display:flex;align-items:flex-start;justify-content:space-between;border-top:1px solid #dcd7cdcc;background:#fffdf8eb;backdrop-filter:blur(18px)}.nav button{width:48px;border:0;background:transparent;color:#939b96;font-size:9px}.nav span{display:block;margin-bottom:3px;font-size:21px}.nav .active{color:var(--sage);font-weight:700}.nav .plus{width:50px;height:50px;margin-top:-27px;border:5px solid var(--paper);border-radius:50%;background:var(--clay);color:#fff;font-size:27px}.backdrop{position:fixed;z-index:10;inset:0;display:none;align-items:flex-end;justify-content:center;background:#1d26224d}.backdrop.show{display:flex}.sheet{width:min(430px,100%);padding:28px 24px calc(26px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--card)}.sheet h2{margin-bottom:18px}.sheet input{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:14px;outline:none;background:#faf8f3}.primary{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:var(--sage);color:#fff;font-weight:700}@media(min-width:700px){.app{margin-top:24px;margin-bottom:24px;border-radius:35px}.nav{bottom:24px;border-radius:0 0 35px 35px}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div><p class="eyebrow" id="date"></p><h1>早上好，小夏</h1></div><button class="avatar">夏</button></header>
  <section class="focus"><div><span class="tag">今日节奏</span><h2>慢慢来，也是在前进</h2><p>专注当下最重要的一件小事。</p></div><div class="ring" id="ring"><span id="percent">0%</span></div></section>
  <section class="section"><div class="section-head"><div><p class="kicker">MY DAY</p><h2>今天要做</h2></div><button class="add-link" onclick="openAdd()">＋ 添加</button></div><div class="list" id="tasks"></div></section>
  <section class="section"><div class="section-head"><div><p class="kicker">ROUTINE</p><h2>习惯打卡</h2></div><span class="eyebrow">本周状态</span></div><div class="habits" id="habits"></div></section>
  <section class="note"><p class="kicker">✦ QUICK NOTE</p><h2>此刻想记下什么？</h2><textarea id="note" placeholder="写下一句话、一个想法，或今天的小确幸……"></textarea><p class="hint">内容会自动保存在这台设备</p></section>
</main>
<nav class="nav"><button class="active"><span>⌂</span>今天</button><button><span>◫</span>计划</button><button class="plus" onclick="openAdd()">＋</button><button><span>◌</span>记录</button><button><span>♡</span>我的</button></nav>
<div class="backdrop" id="modal" onclick="closeAdd(event)"><div class="sheet"><p class="kicker">NEW TASK</p><h2>添加一件小事</h2><input id="newTask" placeholder="例如：给妈妈打电话"><button class="primary" onclick="addTask()">加入今天</button></div></div>
<script>
const defaults={tasks:[{id:1,text:'整理本周计划',done:false,time:'09:30'},{id:2,text:'散步 30 分钟',done:true,time:'18:30'}],habits:[{id:1,name:'喝水',icon:'水',done:true,streak:6},{id:2,name:'阅读',icon:'读',done:false,streak:12},{id:3,name:'运动',icon:'动',done:false,streak:4},{id:4,name:'早睡',icon:'眠',done:true,streak:8}],note:''};let data;try{data=JSON.parse(localStorage.getItem('xia-life-desk-static'))||structuredClone(defaults)}catch(e){data=structuredClone(defaults)}
document.getElementById('date').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());const save=()=>localStorage.setItem('xia-life-desk-static',JSON.stringify(data));
function render(){const t=document.getElementById('tasks');t.innerHTML=data.tasks.map(x=>`<button class="task ${x.done?'done':''}" onclick="toggleTask(${x.id})"><span class="check">${x.done?'✓':''}</span><span class="copy"><strong>${esc(x.text)}</strong><small>${esc(x.time)}</small></span><span>›</span></button>`).join('');document.getElementById('habits').innerHTML=data.habits.map(x=>`<button class="habit ${x.done?'on':''}" onclick="toggleHabit(${x.id})"><span class="habit-icon">${x.icon}</span><strong>${x.name}</strong><small>连续 ${x.streak} 天</small></button>`).join('');let p=data.tasks.length?Math.round(data.tasks.filter(x=>x.done).length/data.tasks.length*100):0;document.getElementById('percent').textContent=p+'%';document.getElementById('ring').style.setProperty('--p',p*3.6+'deg')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toggleTask(id){data.tasks=data.tasks.map(x=>x.id===id?{...x,done:!x.done}:x);save();render()}function toggleHabit(id){data.habits=data.habits.map(x=>x.id===id?{...x,done:!x.done}:x);save();render()}function openAdd(){document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('newTask').focus(),100)}function closeAdd(e){if(e.target.id==='modal')document.getElementById('modal').classList.remove('show')}function addTask(){let i=document.getElementById('newTask');let v=i.value.trim();if(!v)return;data.tasks.push({id:Date.now(),text:v,done:false,time:'今天'});i.value='';document.getElementById('modal').classList.remove('show');save();render()}document.getElementById('newTask').addEventListener('keydown',e=>e.key==='Enter'&&addTask());let note=document.getElementById('note');note.value=data.note||'';note.addEventListener('input',()=>{data.note=note.value;save()});render();
</script>
</body></html>
